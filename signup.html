<!DOCTYPE html>

<html lang="en">

<head>
  <meta content="light dark" name="color-scheme" />
  <script>
    (() => {
      try {
        const savedTheme = localStorage.getItem('gyankunjaTheme');
        const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        const theme = savedTheme || systemTheme;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Create Account — Gyankunja</title>
  <link href="images/fav.png" rel="icon" type="image/png" />
  <link href="css/styles.css" rel="stylesheet" />
</head>

<body class="auth-page auth-page-with-navbar">
  <header class="site-header">
    <div class="container navbar">
      <a class="brand" href="index.html"><span class="brand-mark">G</span><span class="brand-name">GYANKUNJA</span></a>
      <nav aria-label="Primary navigation" class="nav-links"><a data-nav="" href="index.html">Home</a><a data-nav=""
          href="notices.html">Notices</a><a data-nav="" href="resources.html">Resources</a><a
          href="index.html#community">Community</a><a data-nav="" href="about.html">About</a></nav>
      <div class="nav-actions">
        <a class="btn btn-outline btn-sm" data-auth-guest="" data-nav="" href="signup.html">Sign Up</a>
        <a class="btn btn-primary btn-sm" data-auth-guest="" data-nav="" href="login.html">Login</a>
        <a class="btn btn-outline btn-sm" data-auth-user="" hidden="" href="dashboard.html">My Dashboard</a>
        <button class="btn btn-primary btn-sm" data-auth-user="" data-logout="" hidden="" type="button">Logout</button>
        <button aria-label="Switch to dark mode" class="theme-toggle theme-toggle-with-label" data-theme-toggle=""
          title="Switch to dark mode" type="button">
          <span aria-hidden="true" data-theme-icon="">☾</span>
          <span class="theme-toggle-text" data-theme-label="">Dark</span>
        </button>
        <button aria-label="Open menu" class="menu-toggle" type="button">☰</button>
      </div>
    </div>
  </header>
  <main class="auth-shell" style="width:min(650px,calc(100% - 32px));padding-top:34px">
    <div class="auth-brand"><a class="brand" href="index.html"><span class="brand-mark">G</span><span class="brand-name"
          style="font-size:1.45rem">GYANKUNJA</span></a></div>
    <section class="auth-card">
      <h1>Create Your Account</h1>
      <p>Create a student account for a dashboard personalized to your selected semester. Public notes remain available
        without login.</p>
      <div class="alert" id="formAlert"></div>
      <form id="signupForm" novalidate="">
        <div class="form-row">
          <div class="form-group"><label for="name">Full Name</label><input class="form-control" id="name" name="name"
              placeholder="Your full name" required="" type="text" /></div>
          <div class="form-group"><label for="studentId">University ID</label><input class="form-control" id="studentId"
              name="studentId" placeholder="Registration number" required="" type="text" /></div>
        </div>
        <div class="form-group"><label for="email">Student Email Address</label><input class="form-control" id="email"
            name="email" placeholder="student@example.com" required="" type="email" /></div>
        <div class="form-row">
          <div class="form-group"><label for="program">Program</label><select class="form-control" id="program"
              name="program" required="">
              <option value="">Select program</option>
              <option>Bachelor of Information Technology</option>
              <option>Bachelor of Computer Science</option>
              <option>Other</option>
            </select></div>
          <div class="form-group"><label for="semester">Current Semester</label><select class="form-control"
              id="semester" name="semester" required="">
              <option value="">Select semester</option>
              <option>Semester I</option>
              <option>Semester II</option>
              <option>Semester III</option>
              <option>Semester IV</option>
              <option>Semester V</option>
              <option>Semester VI</option>
              <option>Semester VII</option>
              <option>Semester VIII</option>
            </select></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label for="signupPassword">Password</label>
            <div class="input-wrap"><input class="form-control" id="signupPassword" name="password"
                placeholder="At least 6 characters" required="" type="password" /><button class="password-toggle"
                data-target="#signupPassword" type="button">Show</button></div>
          </div>
          <div class="form-group"><label for="confirmPassword">Confirm Password</label>
            <div class="input-wrap"><input class="form-control" id="confirmPassword" name="confirmPassword"
                placeholder="Repeat password" required="" type="password" /><button class="password-toggle"
                data-target="#confirmPassword" type="button">Show</button></div>
          </div>
        </div>
        <label class="check-label" style="margin:2px 0 18px"><input name="terms" type="checkbox" /> I agree to the <a
            class="text-primary" data-demo-action="Terms page can be added later." href="#">Terms</a> and <a
            class="text-primary" data-demo-action="Privacy page can be added later." href="#">Privacy
            Policy</a>.</label>
        <button class="btn btn-primary btn-block" type="submit">CREATE ACCOUNT</button>
      </form>
      <div class="auth-divider">Or sign up with</div>
      <div class="social-buttons"><button class="social-btn"
          data-demo-action="Google authentication will be connected later."><span class="social-mark"
            style="background:#4285f4">G</span>Google</button><button class="social-btn"
          data-demo-action="Microsoft authentication will be connected later."><span class="social-mark"
            style="background:#f35325">M</span>Microsoft</button></div>
      <p class="auth-footer-text">Already have an account? <a class="text-primary" href="login.html"><strong>Sign
            in</strong></a></p>
    </section>
  </main>
  <div class="auth-wave"></div>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>

</html>
